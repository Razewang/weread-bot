name: Auto Reading Bot

on:
  # 定时触发：每天一次
  schedule:
    - cron: '17 0 * * *'   # UTC 00:17 = 北京时间 08:17
  
  # 拉取请求触发，用于测试阅读
  pull_request:
    branches: [ main ]
    paths:
      - 'weread-bot.py'
      - 'requirements.txt'
      - '.github/workflows/auto-reading.yml'
      - '.github/workflows/ci.yml'

  # 手动触发
  workflow_dispatch:
    inputs:
      target_duration:
        description: '阅读时长（分钟，格式：10-20。留空时默认 45）'
        required: false
        default: ''
        type: string
      reading_mode:
        description: '阅读模式'
        required: false
        default: 'smart_random'
        type: choice
        options:
        - smart_random
        - sequential
        - pure_random
      notify_enabled:
        description: '启用通知'
        required: false
        default: true
        type: boolean
      notify_only_on_failure:
        description: '仅失败时发送通知'
        required: false
        default: false
        type: boolean
      history_enabled:
        description: '启用执行历史持久化'
        required: false
        default: true
        type: boolean
      history_max_entries:
        description: '执行历史最多保留多少条'
        required: false
        default: '50'
        type: string

jobs:
  auto-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2小时超时
    env:
      # 仓库只保存一个 Secret：OP_SERVICE_ACCOUNT_TOKEN；其余配置每次运行时从 1Password 实时读取
      # （来自 fork 的 pull_request 拿不到 Secret，此时跳过 1Password 加载）
      HAS_OP: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1Password 引用使用 vault/item ID（vault 名称为中文，op:// 名称引用不可用）
    #   WEREAD_CURL_STRING -> 1Password 条目 "WEREAD_CURL_STRING"     字段 credential
    #   REMINDER_PUSH_KEY  -> 1Password 条目 "reminder推送密钥-复合"   字段 credential
    - name: Load secrets from 1Password
      if: env.HAS_OP == 'true'
      uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
      with:
        export-env: true
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        WEREAD_CURL_STRING: op://bijq6bcgreqllzb6dttxtra3sq/ra6734j5oqgl2tz6eznv3wkiay/credential
        REMINDER_PUSH_KEY: op://bijq6bcgreqllzb6dttxtra3sq/fcwwc726ujg7ef6s5z7zjwsjee/credential

    - name: Check loaded values (no secret output)
      run: |
        if [ -n "${WEREAD_CURL_STRING}" ]; then
          lines=$(printf '%s\n' "${WEREAD_CURL_STRING}" | wc -l)
          case "${WEREAD_CURL_STRING}" in curl*) starts=yes ;; *) starts=no ;; esac
          echo "WEREAD_CURL_STRING: loaded, ${lines} lines, starts with curl: ${starts}"
        else
          echo "::warning::WEREAD_CURL_STRING is empty (1Password not loaded?)"
        fi
        echo "REMINDER_PUSH_KEY: $([ -n "${REMINDER_PUSH_KEY}" ] && echo "loaded, length ${#REMINDER_PUSH_KEY}" || echo empty)"

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Resolve runtime parameters
      env:
        INPUT_TARGET_DURATION: ${{ github.event.inputs.target_duration }}
        # 设置了 REMINDER_PUSH_KEY（1Password）时通过 Apprise 插件推送到 Reminder（复合通道），否则沿用 APPRISE_URL Secret
        SECRET_APPRISE_URL: ${{ secrets.APPRISE_URL }}
      run: |
        # 阅读时长（分钟）：手动输入优先，否则使用下方默认值（定时任务即用此值，可写 45 或 40-50）
        DEFAULT_TARGET_DURATION="45"
        target_duration="${INPUT_TARGET_DURATION}"
        source="workflow_dispatch input"

        if [ -z "$target_duration" ]; then
          target_duration="${DEFAULT_TARGET_DURATION}"
          source="workflow default"
        fi

        echo "TARGET_DURATION=$target_duration" >> "$GITHUB_ENV"
        echo "Resolved TARGET_DURATION=${target_duration} (source: ${source})"

        if [ -n "${REMINDER_PUSH_KEY}" ]; then
          apprise_url="reminder://${REMINDER_PUSH_KEY}"
          reminder_configured=true
        else
          apprise_url="${SECRET_APPRISE_URL}"
          reminder_configured=false
        fi
        if [ -n "$apprise_url" ]; then
          echo "::add-mask::${apprise_url}"
          echo "APPRISE_URL=${apprise_url}" >> "$GITHUB_ENV"
        fi
        echo "REMINDER_CONFIGURED=${reminder_configured}" >> "$GITHUB_ENV"

    - name: Create config file
      run: |
        cat > config.yaml <<EOF
        app:
          name: "WeReadBot-GitHub-Action"
          startup_mode: "immediate"
          startup_delay: "1-2"

        reading:
          mode: "${{ github.event.inputs.reading_mode || 'smart_random' }}"
          # 目标阅读时长（分钟），支持区间随机，格式如："1" 或 "1-2"
          target_duration: "${TARGET_DURATION}"
          reading_interval: "30-48"
          use_curl_data_first: true
          fallback_to_config: true
          smart_random:
            book_continuity: 0.8
            chapter_continuity: 0.7
            book_switch_cooldown: 3600

        human_simulation:
          enabled: false
          reading_speed_variation: true
          break_probability: 0.15
          break_duration: "10-20"
          rotate_user_agent: false

        network:
          timeout: 30
          retry_times: 3
          retry_delay: "5-15"
          rate_limit: 10

        notification:
          enabled: ${{ github.event.inputs.notify_enabled != 'false' }}
          include_statistics: true
          only_on_failure: ${{ github.event.inputs.notify_only_on_failure == 'true' }}
          triggers:
            session_success: ${{ github.event.inputs.notify_only_on_failure != 'true' }}
            multi_user_summary: ${{ github.event.inputs.notify_only_on_failure != 'true' }}
            session_failure: true
            runtime_error: true
            general: true

        logging:
          level: "INFO"
          format: "detailed"
          file: "logs/weread.log"
          max_size: "10MB"
          backup_count: 5
          console: true

        history:
          enabled: ${{ github.event.inputs.history_enabled != 'false' }}
          file: "logs/run-history.json"
          max_entries: ${{ github.event.inputs.history_max_entries || '50' }}
          persist_runtime_error: true
        EOF

    - name: Create logs directory
      run: mkdir -p logs

    # Reminder 推送：通过 Apprise 自定义插件 (reminder://<key>) 接入，无需修改 weread-bot.py。
    # apprise.Apprise() 的 Python API 默认不扫描插件目录，因此用 sitecustomize 在解释器启动时加载。
    - name: Install Reminder notification plugin (Apprise)
      run: |
        plugin_dir="$HOME/.config/apprise/plugins"
        hook_dir="$RUNNER_TEMP/pyhooks"
        mkdir -p "$plugin_dir" "$hook_dir"
        cp .github/apprise-plugins/reminder.py "$plugin_dir/reminder.py"
        cp .github/apprise-plugins/sitecustomize.py "$hook_dir/sitecustomize.py"
        echo "APPRISE_PLUGIN_PATH=$plugin_dir" >> "$GITHUB_ENV"
        echo "PYTHONPATH=$hook_dir" >> "$GITHUB_ENV"
        APPRISE_PLUGIN_PATH="$plugin_dir" PYTHONPATH="$hook_dir" python -c "import apprise; assert apprise.Apprise().add('reminder://selftest'), 'reminder plugin not registered'; print('Reminder Apprise plugin registered')"

    - name: Run WeRead Bot
      env:
        # Cookie刷新QL属性，根据不同用户的环境，可能需要设置为True或False来确保cookie刷新正常工作，默认值为false
        HACK_COOKIE_REFRESH_QL: ${{ secrets.HACK_COOKIE_REFRESH_QL }}
        # WEREAD_CURL_STRING 由 1Password 加载步骤导出到 GITHUB_ENV（多用户：多段 curl 之间至少两个空行）
        # 多用户并发控制，未设置默认 1（顺序执行）
        MAX_CONCURRENT_USERS: ${{ secrets.MAX_CONCURRENT_USERS || 1 }}
        # 单用户连续阅读失败上限，未设置时默认 5
        MAX_CONSECUTIVE_FAILURES: ${{ secrets.MAX_CONSECUTIVE_FAILURES || 5 }}
        # 通知相关环境变量
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        # APPRISE_URL / REMINDER_CONFIGURED 由 "Resolve runtime parameters" 步骤写入 GITHUB_ENV
        BARK_SERVER: ${{ secrets.BARK_SERVER }}
        BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        BARK_SOUND: ${{ secrets.BARK_SOUND }}
        NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        FEISHU_MSG_TYPE: ${{ secrets.FEISHU_MSG_TYPE }}
        WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
        WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
        DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        DINGTALK_MSG_TYPE: ${{ secrets.DINGTALK_MSG_TYPE }}
        GOTIFY_SERVER: ${{ secrets.GOTIFY_SERVER }}
        GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
        GOTIFY_TITLE: ${{ secrets.GOTIFY_TITLE }}
        # 代理设置（可选）
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        SERVERCHAN3_UID: ${{ secrets.SERVERCHAN3_UID }}
        SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}
        SERVERCHAN3_TAGS: ${{ secrets.SERVERCHAN3_TAGS }}
        SERVERCHAN3_SHORT: ${{ secrets.SERVERCHAN3_SHORT }}
        PUSHDEER_PUSHKEY: ${{ secrets.PUSHDEER_PUSHKEY }}
        PUSHDEER_TYPE: ${{ secrets.PUSHDEER_TYPE }}
        NOTIFICATION_ONLY_ON_FAILURE: ${{ secrets.NOTIFICATION_ONLY_ON_FAILURE || github.event.inputs.notify_only_on_failure == 'true' || 'false' }}
        HISTORY_ENABLED: ${{ secrets.HISTORY_ENABLED || github.event.inputs.history_enabled == 'true' || 'true' }}
        HISTORY_FILE: ${{ secrets.HISTORY_FILE || 'logs/run-history.json' }}
        HISTORY_MAX_ENTRIES: ${{ secrets.HISTORY_MAX_ENTRIES || github.event.inputs.history_max_entries || '50' }}
        HISTORY_PERSIST_RUNTIME_ERROR: ${{ secrets.HISTORY_PERSIST_RUNTIME_ERROR || 'true' }}
        # 其他环境变量
        TZ: 'Asia/Shanghai'
      run: |
        echo "开始自动阅读任务..."
        echo "当前时间: $(date)"
        echo "运行参数:"
        echo "- 阅读时长: ${TARGET_DURATION}"
        echo "- 阅读模式: ${{ github.event.inputs.reading_mode || 'smart_random' }}"
        echo "- 启用通知: ${{ github.event.inputs.notify_enabled != 'false' }}"
        echo "- 仅失败通知: ${{ github.event.inputs.notify_only_on_failure == 'true' }}"
        echo "- 历史持久化: ${{ github.event.inputs.history_enabled != 'false' }}"
        echo "- 历史保留条数: ${{ github.event.inputs.history_max_entries || '50' }}"
        echo "- Reminder 推送: ${REMINDER_CONFIGURED}"
        echo "================================"
        
        # 运行阅读机器人
        python weread-bot.py --config config.yaml

    - name: Upload runtime artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: weread-runtime-${{ github.run_id }}
        path: |
          logs/weread.log
          logs/run-history.json
        if-no-files-found: warn
        retention-days: 7
